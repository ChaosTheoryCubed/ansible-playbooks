- name: Check if SSH key exists
  ansible.builtin.include_tasks: check_key.yml

- name: Generate SSH key if missing
  ansible.builtin.include_tasks: generate_key.yml
  when: not ssh_key_exists

- name: Setup known_hosts for Git server
  ansible.builtin.include_tasks: setup_known_hosts.yml

- name: Test if SSH key works
  ansible.builtin.include_tasks: test_auth.yml

- name: Prompt user to add key if not authenticated
  ansible.builtin.include_tasks: prompt_user.yml
  when: not ssh_authenticated
